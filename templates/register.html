<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustVault | Create Account</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Arial,sans-serif;color:#f8fafc;background:radial-gradient(circle at top left,#29245d,#0b1020 60%)}
.card{width:100%;max-width:440px;background:#161c31;border:1px solid #343d5c;border-radius:22px;padding:34px;box-shadow:0 24px 70px #0005}
.logo{color:#c4b5fd;font-size:13px;letter-spacing:1px;margin-bottom:20px}
h1{font-size:29px;margin-bottom:10px}
.sub{color:#aab3c8;font-size:14px;line-height:1.6;margin-bottom:24px}
label{display:block;font-size:13px;margin:17px 0 8px;color:#dbe2f1}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #414b68;background:#10172a;color:white;outline:none}
input:focus{border-color:#a78bfa}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:linear-gradient(100deg,#7c3aed,#5b5ce2);color:white;font-weight:bold;cursor:pointer}
a{color:#c4b5fd;text-decoration:none}
.links{text-align:center;margin-top:22px;font-size:13px;line-height:2;color:#aab3c8}
.message{background:#42232f;color:#fecdd3;padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<main class="card">
<div class="logo">● TRUSTVAULT · SECURE DOCUMENT PLATFORM</div>
<h1>Create your account</h1>
<p class="sub">Set up your secure workspace to manage and protect your documents.</p>

{% for message in get_flashed_messages() %}
<div class="message">{{ message }}</div>
{% endfor %}

<form method="POST" action="{{ url_for('register') }}">
<label for="username">Username</label>
<input id="username" name="username" required maxlength="80" autocomplete="username">

<label for="email">Email address</label>
<input id="email" type="email" name="email" required maxlength="120" autocomplete="email">

<label for="password">Password (minimum 8 characters)</label>
<input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">

<button type="submit">Create secure account →</button>
</form>

<div class="links">
Already registered? <a href="{{ url_for('login') }}">Sign in</a>
<br><a href="{{ url_for('home') }}">Back to home</a>
</div>
</main>
</body>
</html>
